name: Cooked
options:
  bundleIdPrefix: com.cooked
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

targets:
  Cooked:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Cooked
        excludes:
          - "**/.DS_Store"
    resources:
      - path: Cooked/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cooked.app
        INFOPLIST_FILE: Cooked/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Cooked/App/Cooked.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        UIDeviceFamily[sdk=iphoneos*]: 1
        UIRequiresFullScreen: YES
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      configs:
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
    entitlements:
      path: Cooked/App/Cooked.entitlements
    info:
      path: Cooked/App/Info.plist
      properties:
        CFBundleName: Cooked
        CFBundleDisplayName: Cooked
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: YES
        NSHealthShareUsageDescription: "Cooked reads your sleep, workouts, and activity data to calculate your daily score."
        NSHealthUpdateUsageDescription: "Cooked may write workout data you log manually."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIAppFonts:
          - Syne-ExtraBold.ttf
          - DMSans-Light.ttf
          - DMSans-Regular.ttf
          - DMSans-Medium.ttf
          - SpaceMono-Regular.ttf
          - SpaceMono-Bold.ttf

schemes:
  Cooked:
    build:
      targets:
        Cooked: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
